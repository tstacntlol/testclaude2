backend:
  name: git-gateway
  branch: claude/check-netlify-french-repo-sRazt

publish_mode: editorial_workflow

# Media files will be stored in the repository
media_folder: "pdfs"
public_folder: "/pdfs"

# Collections define the structure of the content
collections:
  # PDF Sections - One file per section
  - name: "pdf_sections"
    label: "PDF Secties"
    files:
      - name: "programma"
        label: "Programma"
        file: "content/pdfs/programma.json"
        fields:
          - {label: "Titel", name: "title", widget: "string", default: "Programma"}
          - {label: "PDF Bestand", name: "pdf", widget: "file", required: false, hint: "Upload een PDF bestand voor het programma"}
          - {label: "Actief", name: "active", widget: "boolean", default: true}

      - name: "traject"
        label: "Vrijetijdstrajectbegeleiding"
        file: "content/pdfs/traject.json"
        fields:
          - {label: "Titel", name: "title", widget: "string", default: "Vrijetijdstrajectbegeleiding"}
          - {label: "PDF Bestand", name: "pdf", widget: "file", required: false, hint: "Upload een PDF bestand voor vrijetijdstrajectbegeleiding"}
          - {label: "Actief", name: "active", widget: "boolean", default: true}

      - name: "over_ons"
        label: "Over Ons"
        file: "content/pdfs/over-ons.json"
        fields:
          - {label: "Titel", name: "title", widget: "string", default: "Over Ons"}
          - {label: "PDF Bestand", name: "pdf", widget: "file", required: false, hint: "Upload een PDF bestand voor Over Ons"}
          - {label: "Actief", name: "active", widget: "boolean", default: true}

  # Site Settings
  - name: "settings"
    label: "Website Instellingen"
    files:
      - name: "contact"
        label: "Contact Informatie"
        file: "content/settings/contact.json"
        fields:
          - {label: "Organisatie Naam", name: "organizationName", widget: "string", default: "Linc VZW"}
          - {label: "Email", name: "email", widget: "string"}
          - {label: "Telefoon", name: "phone", widget: "string"}
          - {label: "Adres - Straat", name: "street", widget: "string"}
          - {label: "Adres - Stad", name: "city", widget: "string"}
          - {label: "Adres - Postcode", name: "postalCode", widget: "string"}
          - {label: "Adres - Land", name: "country", widget: "string", default: "België"}
          - label: "Openingsuren"
            name: "hours"
            widget: "object"
            fields:
              - {label: "Weekdagen", name: "weekdays", widget: "string"}
              - {label: "Weekend", name: "weekend", widget: "string"}
          - label: "Social Media"
            name: "social"
            widget: "object"
            fields:
              - {label: "Facebook", name: "facebook", widget: "string", required: false}
              - {label: "Instagram", name: "instagram", widget: "string", required: false}
