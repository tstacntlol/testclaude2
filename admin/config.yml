backend:
  name: git-gateway
  branch: claude/check-netlify-french-repo-sRazt

publish_mode: editorial_workflow

# Media files will be stored in the repository
media_folder: "pdfs"
public_folder: "/pdfs"

# Collections define the structure of the content
collections:
  # PDF Sections - One file per section
  - name: "pdf_sections"
    label: "Sections PDF"
    files:
      - name: "programma"
        label: "Programme"
        file: "content/pdfs/programma.json"
        fields:
          - {label: "Titre", name: "title", widget: "string", default: "Programma"}
          - {label: "Fichier PDF", name: "pdf", widget: "file", required: false, hint: "Téléchargez un fichier PDF pour le programme"}
          - {label: "Actif", name: "active", widget: "boolean", default: true}

      - name: "over_ons"
        label: "À propos"
        file: "content/pdfs/over-ons.json"
        fields:
          - {label: "Titre", name: "title", widget: "string", default: "Over Ons"}
          - {label: "Fichier PDF", name: "pdf", widget: "file", required: false, hint: "Téléchargez un fichier PDF pour À propos"}
          - {label: "Actif", name: "active", widget: "boolean", default: true}

  # Site Settings
  - name: "settings"
    label: "Paramètres du site"
    files:
      - name: "contact"
        label: "Informations de contact"
        file: "content/settings/contact.json"
        fields:
          - {label: "Nom de l'organisation", name: "organizationName", widget: "string", default: "L!NC ASBL"}
          - {label: "Email", name: "email", widget: "string"}
          - {label: "Téléphone", name: "phone", widget: "string"}
          - {label: "Adresse - Rue", name: "street", widget: "string"}
          - {label: "Adresse - Ville", name: "city", widget: "string"}
          - {label: "Adresse - Code postal", name: "postalCode", widget: "string"}
          - {label: "Adresse - Pays", name: "country", widget: "string", default: "Belgique"}
          - label: "Heures d'ouverture"
            name: "hours"
            widget: "object"
            fields:
              - {label: "Jours de semaine", name: "weekdays", widget: "string"}
              - {label: "Week-end", name: "weekend", widget: "string"}
          - label: "Réseaux sociaux"
            name: "social"
            widget: "object"
            fields:
              - {label: "Facebook", name: "facebook", widget: "string", required: false}
              - {label: "Instagram", name: "instagram", widget: "string", required: false}
